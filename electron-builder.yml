appId: io.github.andrewrozumny.arcode
productName: ARcode
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - '!node_modules/node-pty/{src,deps,scripts,prebuilds/win32-*}/**'
asarUnpack:
  - node_modules/node-pty/**
extraResources:
  - from: resources/arcode-statusline.py
    to: arcode-statusline.py
npmRebuild: false
mac:
  target:
    - dir
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: false
  identity: null
  darkModeSupport: true
  electronLanguages:
    - en
    - en_GB
  extendInfo:
    NSHighResolutionCapable: true
    LSMinimumSystemVersion: "12.0"
